name: Build APK

on:
  push:
    branches: [main, book-server]
  # Every pull request is analyzed, tested and built before it is merged.
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, pinned so a moved tag cannot reach the signing key
        with:
          channel: stable
          # Pinned: the newest Flutter deprecates material.dart, which fails the analyze step.
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The signing key lives in repository secrets, never in the code. Without
      # it (a pull request from a fork) the build is signed with debug keys.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=chapterly\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
          fi

      - name: Build release APK
        run: flutter build apk --release

      # Shows who signed the APK, so you can see the fixed key was used.
      - name: Show signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chapterly-apk
          path: build/app/outputs/flutter-apk/app-release.apk
